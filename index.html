<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070a">
<title>Bioglow</title>
<style>
:root{
  --bg:#04070a; --lime:#c6f432; --green:#7ddc1f; --mint:#3de8c0; --gold:#ffd166;
  --text:#eef5d8; --muted:#8fa07a; --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.12); --bad:#ff5c6c; --good:#34e8a0; --r:24px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);
  -webkit-user-select:none;user-select:none;overflow-x:hidden;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}

/* ---------- ФОН ---------- */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:float 18s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:520px;height:520px;background:#5fbf12;top:-160px;left:-120px}
.aurora i:nth-child(2){width:460px;height:460px;background:#0fa88a;bottom:-140px;right:-100px;animation-delay:-6s}
.aurora i:nth-child(3){width:340px;height:340px;background:#b6e41c;top:40%;left:55%;opacity:.22;animation-delay:-11s}
@keyframes float{to{transform:translate(60px,40px) scale(1.15)}}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}
#fx{z-index:50}

/* ---------- КАРКАС ---------- */
.shell{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px 40px;min-height:100dvh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:18px;border-radius:999px;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);position:sticky;top:8px;z-index:20}
.logo{font-weight:800;letter-spacing:2px;font-size:18px;padding:0 10px;background:linear-gradient(120deg,#fff,var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer}
.spacer{flex:1}
.back{display:none;padding:8px 16px;border-radius:999px;background:var(--glass2);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--lime);transition:.2s}
.back.show{display:inline-block}
.back:hover{background:rgba(198,244,50,.18)}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:999px;padding:3px;border:1px solid var(--line)}
.seg button{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800;color:var(--muted);transition:.2s}
.seg button.on{background:linear-gradient(135deg,var(--lime),var(--green));color:#0a1203;box-shadow:0 0 14px rgba(198,244,50,.45)}
.ibtn{width:36px;height:36px;border-radius:50%;background:var(--glass2);border:1px solid var(--line);font-size:16px;display:grid;place-items:center;transition:.2s}
.ibtn:hover{background:rgba(198,244,50,.18)}

/* ---------- МЕНЮ ---------- */
.hero{text-align:center;margin:10px 0 28px;animation:rise .7s both}
.hero h1{font-size:clamp(44px,10vw,84px);font-weight:900;letter-spacing:6px;line-height:1;
  background:linear-gradient(135deg,#fff 10%,var(--lime) 55%,var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 28px rgba(198,244,50,.45))}
.hero p{margin-top:12px;color:var(--muted);letter-spacing:3px;font-size:13px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{position:relative;text-align:left;padding:22px;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s;
  animation:rise .6s both;display:flex;flex-direction:column;gap:6px;min-height:178px}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,80%) var(--my,0%),rgba(198,244,50,.18),transparent 55%);opacity:0;transition:.3s}
.card:hover{transform:translateY(-6px);border-color:rgba(198,244,50,.55);box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 30px rgba(198,244,50,.18)}
.card:hover::before{opacity:1}
.card .ic{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;font-size:34px;margin-bottom:8px;
  background:linear-gradient(145deg,rgba(198,244,50,.22),rgba(61,232,192,.1));border:1px solid rgba(198,244,50,.3);box-shadow:inset 0 0 20px rgba(198,244,50,.12)}
.card h3{font-size:20px;font-weight:800}
.card p{color:var(--muted);font-size:14px;line-height:1.4}
.card .bestchip{margin-top:auto;align-self:flex-start;font-size:12px;font-weight:700;color:var(--gold);padding:4px 10px;border-radius:999px;background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.25)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ---------- ПАНЕЛЬ ИГРЫ ---------- */
#view{flex:1;display:flex;flex-direction:column}
.panel{position:relative;width:100%;max-width:720px;margin:0 auto;padding:22px;border-radius:28px;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 24px 60px rgba(0,0,0,.4);animation:rise .45s both;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.hud{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{padding:8px 16px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid var(--line);font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.chip b{color:var(--lime);font-size:16px}
.hint{text-align:center;color:var(--muted);font-size:13px}
.btn{padding:13px 26px;border-radius:999px;font-weight:800;font-size:15px;transition:.2s;border:1px solid var(--line)}
.btn.primary{background:linear-gradient(135deg,var(--lime),var(--green));color:#0a1203;border-color:transparent;box-shadow:0 0 22px rgba(198,244,50,.35)}
.btn.primary:hover:not(:disabled){transform:scale(1.04);box-shadow:0 0 34px rgba(198,244,50,.6)}
.btn.ghost{background:var(--glass2)}
.btn.ghost:hover{background:rgba(255,255,255,.16)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.big{padding:16px 30px;font-size:17px;width:100%}

/* оверлей */
.overlay{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:rgba(4,7,10,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fade .3s both;border-radius:inherit}
.ovbox{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.ovicon{font-size:64px;filter:drop-shadow(0 0 18px rgba(198,244,50,.5))}
.ovbox h2{font-size:34px;font-weight:900;background:linear-gradient(135deg,#fff,var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent}
.ovbox p{color:var(--muted);font-size:16px}
.newrec{color:var(--gold)!important;font-weight:800;animation:pulse 1s infinite alternate}
.ovbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes pulse{to{transform:scale(1.08)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- УГАДАЙ ПТИЦУ ---------- */
.target{height:170px;border-radius:22px;background:rgba(0,0,0,.28);border:1px solid rgba(198,244,50,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:.25s;position:relative;overflow:hidden}
.target:hover{border-color:rgba(198,244,50,.6);box-shadow:0 0 30px rgba(198,244,50,.18)}
.tEmoji{font-size:62px;line-height:1;display:none;filter:drop-shadow(0 0 14px rgba(198,244,50,.55));animation:pop .4s both}
.tText{font-size:17px;color:var(--muted);padding:0 14px;text-align:center}
.eq{display:flex;gap:5px;align-items:flex-end;height:44px}
.eq i{width:6px;height:8px;border-radius:3px;background:linear-gradient(var(--lime),var(--mint));opacity:.5}
.eq.on i{opacity:1;animation:eq .6s ease-in-out infinite alternate}
.eq.on i:nth-child(2n){animation-duration:.45s}.eq.on i:nth-child(3n){animation-duration:.8s}.eq.on i:nth-child(4n){animation-delay:-.2s}
@keyframes eq{to{height:44px}}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.opt{padding:16px 8px;border-radius:20px;background:var(--glass2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;transition:.2s;font-weight:700}
.opt .oe{font-size:40px}
.opt:hover{transform:translateY(-4px);border-color:rgba(198,244,50,.55);box-shadow:0 10px 24px rgba(198,244,50,.14)}
.opt.correct{background:rgba(52,232,160,.22);border-color:var(--good);box-shadow:0 0 24px rgba(52,232,160,.45)}
.opt.wrong{background:rgba(255,92,108,.22);border-color:var(--bad);box-shadow:0 0 24px rgba(255,92,108,.45);animation:shake .4s}

/* ---------- РУЛЕТКА ---------- */
.hearts{display:flex;gap:10px;justify-content:center}
.heart{width:38px;height:38px;transition:.3s}
.heart.lost{animation:shake .5s}
.reels{display:flex;gap:clamp(10px,3vw,22px);justify-content:center;padding:10px 0}
.reel{width:clamp(84px,24vw,150px);aspect-ratio:1;border-radius:26px;display:grid;place-items:center;font-size:clamp(46px,13vw,84px);
  background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(255,255,255,.05) 50%,rgba(0,0,0,.45));border:2px solid rgba(198,244,50,.3);box-shadow:inset 0 0 30px rgba(0,0,0,.6),0 10px 24px rgba(0,0,0,.4);overflow:hidden;transition:border-color .3s}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}
.ord{display:flex;align-items:center;gap:3px;font-size:clamp(15px,4vw,22px);padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.3);border:1px solid var(--line);white-space:nowrap}
.ord i{font-style:normal;opacity:.45;transition:.2s}.ord i.cur{opacity:1;transform:scale(1.25);filter:drop-shadow(0 0 6px rgba(198,244,50,.8))}
.ord u{text-decoration:none;color:var(--muted);font-size:12px}
.reel span{display:block}
.reel.tick span{animation:tick .19s ease-out}
.reel.spin{border-color:var(--lime);box-shadow:inset 0 0 30px rgba(0,0,0,.6),0 0 24px rgba(198,244,50,.35)}
.reel.win{border-color:var(--good);animation:glowWin .5s infinite alternate}
@keyframes tick{from{transform:translateY(-70%);opacity:0;filter:blur(5px)}to{transform:none;opacity:1;filter:none}}
@keyframes glowWin{to{transform:scale(1.07);box-shadow:0 0 40px rgba(52,232,160,.7)}}

/* ---------- ПАМЯТЬ ---------- */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2vw,14px);width:100%;max-width:520px;margin:0 auto}
.mcard{aspect-ratio:1;perspective:700px}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.mcard.flip .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mcard .f{background:linear-gradient(145deg,rgba(198,244,50,.2),rgba(61,232,192,.12));border:1px solid rgba(198,244,50,.35);font-size:clamp(20px,5vw,30px);color:var(--lime)}
.mcard .f::after{content:"✦"}
.mcard .b{transform:rotateY(180deg);background:rgba(0,0,0,.4);border:1px solid var(--line);font-size:clamp(30px,8vw,48px)}
.mcard.done .b{background:rgba(52,232,160,.18);border-color:var(--good);box-shadow:0 0 18px rgba(52,232,160,.35)}
.mcard:not(.flip):hover .f{border-color:var(--lime)}
.chip.lowtries{border-color:var(--bad);animation:pulse .6s infinite alternate}
.chip.lowtries b{color:var(--bad)}

@media (max-width:520px){
  .shell{padding-left:10px;padding-right:10px}
  .panel{padding:16px;border-radius:24px}
  .logo{font-size:15px;letter-spacing:1px;padding:0 4px}
  .seg button{padding:6px 9px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>

</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>

<div class="shell">
  <header class="topbar">
    <button class="back" id="backBtn"></button>
    <div class="logo" id="logo">BIOGLOW</div>
    <div class="spacer"></div>
    <div class="seg" id="langSeg">
      <button data-l="ru">РУС</button><button data-l="kk">ҚАЗ</button><button data-l="en">ENG</button>
    </div>
    <button class="ibtn" id="muteBtn" aria-label="sound">🔊</button>
  </header>
  <main id="view"></main>
</div>

function mountBirds(p, ctx) {

function mountRoulette(p, ctx) {
  const SYM = ['🪿', '🌾', '🐟']; let tries = 3, state = 0, order = [], pos = [0, 0, 0], ids = [null, null, null];
  p.innerHTML = `
    <div class="hearts" id="rH"></div>
    <div class="hint">${t('order')}</div>
    <div class="reels">${[0, 1, 2].map(i => `<div class="col"><div class="ord" id="rO${i}"></div><div class="reel" id="rR${i}"><span></span></div></div>`).join('')}</div>

  const reels = [0, 1, 2].map(i => $('#rR' + i, p)), ords = [0, 1, 2].map(i => $('#rO' + i, p)), btn = $('#rBtn', p), H = $('#rH', p);
  const hearts = [false, false, false];
  const drawHearts = () => { H.innerHTML = hearts.map(b => heartSVG(b)).join(''); };
  const showOrder = i => { ords[i].innerHTML = order[i].map((s, k) => `<i class="${k === pos[i] ? 'cur' : ''}">${s}</i>`).join('<u>›</u>'); };
  const draw = i => { reels[i].firstElementChild.textContent = order[i][pos[i]]; reels[i].classList.remove('tick'); void reels[i].offsetWidth; reels[i].classList.add('tick'); showOrder(i); };
  const newOrders = () => { order = [0, 1, 2].map(() => shuffle(SYM)); pos = [0, 1, 2].map(() => Math.random() * 3 | 0); [0, 1, 2].forEach(draw); };
  const startReel = i => { reels[i].classList.add('spin'); ids[i] = ctx.interval(() => { pos[i] = (pos[i] + 1) % 3; draw(i); sfx.click(); }, 200); };
  const stopReel = i => { clearInterval(ids[i]); reels[i].classList.remove('spin'); sfx.flip(); };

  function spin() {
    if (tries <= 0 || btn.disabled) return;
    if (state === 0) { state = 1; btn.textContent = t('stop'); newOrders(); [0, 1, 2].forEach(startReel); }
    else if (state === 1) { stopReel(0); state = 2; }

  }

    c.style.animationDelay = (i * 70) + 'ms';
    c.onclick = () => { sfx.click(); openGame(gm.id); };
    c.addEventListener('pointermove', e => { const r = c.getBoundingClientRect(); c.style.setProperty('--mx', (e.clientX - r.left) / r.width * 100 + '%'); c.style.setProperty('--my', (e.clientY - r.top) / r.height * 100 + '%'); });
    g.appendChild(c);
  });
  view.appendChild(g); scrollTo(0, 0);
}
function openGame(id) {
  destroyCurrent(); const gm = GAMES.find(x => x.id === id); view.innerHTML = '';
  const panel = el('section', 'panel'); view.appendChild(panel);
  const ctx = makeCtx(); current = { id, ctx }; backBtn.classList.add('show'); gm.mount(panel, ctx); scrollTo(0, 0);
}
function applyChrome() {
  document.documentElement.lang = lang; backBtn.textContent = t('back');
  document.querySelectorAll('#langSeg button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  const m = $('#muteBtn'); m.textContent = muted ? '🔇' : '🔊'; m.title = muted ? t('soundOff') : t('soundOn');
}
function setLang(l) { lang = l; store.set('lang', l); applyChrome(); if (current) openGame(current.id); else showMenu(); }
document.querySelectorAll('#langSeg button').forEach(b => b.onclick = () => { setLang(b.dataset.l); });
$('#muteBtn').onclick = () => { muted = !muted; store.set('muted', muted); applyChrome(); if (!muted) sfx.click(); };
backBtn.onclick = () => { sfx.click(); showMenu(); };
$('#logo').onclick = () => showMenu();
applyChrome(); showMenu();
</script>
</body>
</html>
